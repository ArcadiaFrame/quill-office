<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessibility Checker</title>
    <link rel="stylesheet" href="../v1/plugins.css">
    <link rel="stylesheet" href="style.css">
    <script src="../v1/plugins.js"></script>
    <script src="../v1/plugins-ui.js"></script>
    <script src="code.js"></script>
</head>
<body>
    <main class="a11y">
        <header>
            <button type="button" id="check" class="btn-text-default">Check document</button>
            <p id="summary" class="summary" role="status" aria-live="polite">Checking…</p>
        </header>
        <section id="results" aria-label="Accessibility issues"></section>
        <footer class="tips">
            <p>Tips: give every picture a short description, use Heading 1, 2, 3 in order, and write link text that says where it goes.</p>
        </footer>
    </main>
</body>
</html>
