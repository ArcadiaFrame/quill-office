<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Inspector</title>
    <link rel="stylesheet" href="../v1/plugins.css">
    <link rel="stylesheet" href="style.css">
    <script src="../v1/plugins.js"></script>
    <script src="../v1/plugins-ui.js"></script>
    <script src="code.js"></script>
</head>
<body>
    <main class="a11y">
        <header>
            <button type="button" id="check" class="btn-text-default">Inspect document</button>
            <p id="summary" class="summary" role="status" aria-live="polite">Inspecting…</p>
        </header>
        <section id="results" aria-label="Inspection results"></section>
        <footer class="tips">
            <p>Removing items can't always be undone after saving. Consider saving a copy first (File → Save as).</p>
            <p>The app also records your user name as the author when you save; change it in the start screen's Settings.</p>
        </footer>
    </main>
</body>
</html>
